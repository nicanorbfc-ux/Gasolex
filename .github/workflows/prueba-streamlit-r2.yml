name: Prueba credenciales Streamlit R2

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar boto3
        run: pip install boto3

      - name: Probar acceso a R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TEST_STREAMLIT_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_STREAMLIT_SECRET_KEY }}
          R2_ACCOUNT_ID: f0026ea67a66c1918d0233254ca21b0f
        run: |
          python - <<'PY'
          import boto3
          import os
          from botocore.client import Config
          print("Access Key:  ", os.environ["AWS_ACCESS_KEY_ID"][:4] + "****" + os.environ["AWS_ACCESS_KEY_ID"][-4:])
          print("Access Key longitud:", len(os.environ["AWS_ACCESS_KEY_ID"]))
          print("Secret longitud:", len(os.environ["AWS_SECRET_ACCESS_KEY"]))
 
          endpoint = (
              f"https://{os.environ['R2_ACCOUNT_ID']}"
              ".r2.cloudflarestorage.com"
          )

          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name="auto",
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4")
          )

          respuesta = s3.get_object(
              Bucket="gasolex",
              Key="gasolex.db"
          )

          print("LECTURA DE R2: OK")
          print("Tamaño:", respuesta["ContentLength"], "bytes")
          PY